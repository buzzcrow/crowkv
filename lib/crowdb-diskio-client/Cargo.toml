[package]
name = "crowdb-diskio-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client library for CROWDB diskio: async disk write/read/fsync via RPC."
autobenches = false

[lints]
workspace = true

[dependencies]
bytes = "1"
crowdb-common = { path = "../crowdb-common/rust" }
crowdb-protocol = { path = "../crowdb-protocol" }
crowdb-rpc-ffi = { path = "../crowdb-rpc/ffi" }
flatbuffers = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
crowdb-kv-client = { path = "../crowdb-kv-client" }
crowdb-rpc-ffi = { path = "../crowdb-rpc/ffi", features = ["test-util"] }
crowdb-test-harness = { path = "../crowdb-test-harness", features = ["diskio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
