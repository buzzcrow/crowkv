[package]
name = "crowdb-rpc-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Safe Rust async facade over the crowdb-rpc C ABI (R104)."
publish = false

[lib]
name = "crowdb_rpc_ffi"
path = "src/lib.rs"

[features]
default = []
# Auto-init C++ spdlog to a temp dir before any test runs (via ctor)
# and on first RpcServer::new. Used by this crate's own tests (via self
# dev-dependency) and by downstream test binaries (e.g. crowdb-web tests)
# so transport logs go to files instead of stderr.
test-util = ["dep:ctor"]

[dependencies]
crowdb-common = { path = "../../crowdb-common/rust" }
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros", "sync"] }
bytes = "1"
ctor = { version = "1.0.13", optional = true }

[dev-dependencies]
crowdb-common = { path = "../../crowdb-common/rust" }
crowdb-protocol = { path = "../../crowdb-protocol" }
flatbuffers = { workspace = true }
# Self dev-dependency: turns on `test-util` so integration tests auto-init
# C++ logging to a temp dir on first RpcServer::new.
crowdb-rpc-ffi = { path = ".", features = ["test-util"] }

[build-dependencies]
cc = "1"
