[workspace]
name = "crowdb-kv"
version = "0.1.0"
description = "CROWDB — distributed key-value store with multi-paxos groups"
channels = ["conda-forge"]
# Keep glibc requirement low (2.17 = CentOS 7 / Ubuntu 16.04 era) so that
# Linux binaries built in this environment run on older distributions.
# conda-forge packages are built against glibc 2.17 by default.
platforms = [
  "osx-arm64",
  "linux-64",
]

[dependencies]
# C++ build toolchain (lib/crowdb-tree)
cmake = ">=3.20"
make = "*"
cxx-compiler = "*"
gtest = "*"
lz4 = "*"
libabseil = "*"  # lib/crowdb-tree MemTable uses absl::btree_map (plan-tree #9)
spdlog = ">=1.17.0,<2"  # lib/crowdb-tree async file logging (plan-tree #10)
clang-format = ">=19.0.0"
clang-tools = "*"
folly = "*"
isa-l = "*"
# Flatbuffer schema compiler + runtime headers for crowdb-rpc (R104) and
# crowdb-protocol's .fbs codegen. Provides `flatc` and flatbuffers/cpp headers.
flatbuffers = "*"
# Rust toolchain (crowdb-kv)
rust = ">=1.96"
openssl = "*"
pkg-config = "*"
# Frontend
nodejs = ">=22,<23"
# Tools
git = "*"
tokei = "*"
benchmark = ">=1.9.5,<2"
zlib = ">=1.3.2,<2"
xz = ">=5.8.3,<6"
zstd = ">=1.5.7,<2"
bzip2 = ">=1.0.8,<2"
snappy = ">=1.2.2,<2"

# io_uring reactor (lib/crowdb-tree/include/lib/crowdb-tree/reactor.h).
# Linux-only kernel interface -- no osx-arm64 conda-forge build exists, so this
# must be a per-platform target dependency, not a top-level one (design doc
# design/tree/design-crowdb-tree-engine.md §3.5: the reactor itself is excluded from macOS
# builds; see lib/crowdb-tree/CMakeLists.txt's CROWDB_TREE_HAVE_LIBURING gate).
[target.linux-64.dependencies]
liburing = "*"
# RDMA transport for crowdb-rpc (R104 Phase 5), gated behind
# CROWDB_RPC_HAVE_RDMA in lib/crowdb-rpc/CMakeLists.txt. No macOS RNICs, so
# these stay Linux-only (mirrors the liburing per-platform pattern).
# rdma-core provides both libibverbs and librdmacm.
rdma-core = "*"

[tasks]

# ── Build ────────────────────────────────────────────────────────
# C++ libraries only (crowdb-tree, crowdb-rpc, crowdb-diskio). Needed by C++
# ctest tasks. Rust FFI crates compile their own C++ via cc::Build in
# build.rs, so Rust tests do NOT depend on this.
build-cpp = { cmd = "cmake -S lib/crowdb-tree -B lib/crowdb-tree/build -DCMAKE_BUILD_TYPE=Release && cmake --build lib/crowdb-tree/build -j && cmake -S lib/crowdb-rpc -B lib/crowdb-rpc/build -DCMAKE_BUILD_TYPE=Release && cmake --build lib/crowdb-rpc/build -j && cmake -S app/crowdb-diskio -B app/crowdb-diskio/build -DCMAKE_BUILD_TYPE=Release && cmake --build app/crowdb-diskio/build -j" }
# npm deps only (for UI tests and ts-lint). Separated from install-deps
# so test-console-ui doesn't trigger cargo installs of profiling tools.
install-ui-deps = "test -d app/crowdb-web/ui/node_modules || (cd app/crowdb-web/ui && npm ci)"
install-deps = '''
bash -c '
set -e
git config core.hooksPath .githooks
pixi run install-ui-deps
cargo install cargo-tarpaulin || echo "Warning: cargo-tarpaulin install failed (expected on macOS)"
cargo install --locked samply || echo "Warning: samply install failed"
cargo install --locked inferno || echo "Warning: inferno install failed"
'
'''
tree-fmt = '''
find lib/crowdb-tree/src lib/crowdb-tree/include lib/crowdb-tree/tests lib/crowdb-tree/bench lib/crowdb-common/cpp lib/crowdb-rpc/src lib/crowdb-rpc/include lib/crowdb-rpc/tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format -i
'''
tree-lint = "python3 tools/ct_lint.py"
rs-fmt = "cargo fmt --all"
rs-lint = "cargo clippy --all-targets -- -D warnings"
ts-lint = { cmd = "cd app/crowdb-web/ui && npx tsc --noEmit --project tsconfig.e2e.json", depends-on = ["install-ui-deps"] }
# Full build: C++ libs + release Rust binaries + frontend. Used by
# run/bench/profile. Tests use build-cpp (C++ tests) or nothing (Rust tests).
build = { cmd = "cargo build --release --workspace --exclude crowdb-kv-client && cargo build --release -p crowdb-kv-client --features ffi && cd app/crowdb-web/ui && npm run build", depends-on = ["build-cpp", "install-ui-deps"] }
default = { depends-on = ["build"] }

# ── Run ──────────────────────────────────────────────────────────
web = { cmd = "echo 'CROWDB console starting at: http://127.0.0.1:14000/' && cargo run --release -p crowdb-web", depends-on = ["build"] }

# ── Benchmark ────────────────────────────────────────────────────
bench = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode mem --duration-secs 12 --loader-num 2 --connections 1 --workload write", depends-on = ["build"] }
bench-mem = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode mem --duration-secs 30", depends-on = ["build"] }
bench-file = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode file --duration-secs 30", depends-on = ["build"] }
bench-block = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode block --duration-secs 30", depends-on = ["build"] }
bench-burst = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode mem --duration-secs 10 --loader-num 64 --connections 8 --key-space 10000 --value-size 256 --workload mix", depends-on = ["build"] }
bench-soak = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode mem --duration-secs 30 --loader-num 8 --connections 4 --key-space 100000 --value-size 1024 --workload write", depends-on = ["build"] }
bench-hotread = { cmd = "cargo run --release -p crowdb-cli -- bench kv --mode mem --duration-secs 15 --loader-num 32 --connections 4 --key-space 64 --value-size 64 --workload read", depends-on = ["build"] }
bench-compare = { cmd = "cargo run --release -p crowdb-cli -- bench compare", depends-on = ["build"] }

# ── Profile ───────────────────────────────────────────────────────
profile-write = { cmd = "bash tools/profile-write.sh", depends-on = ["build"] }

# ── Test ─────────────────────────────────────────────────────────
# Tasks are grouped by CI job (see doc/working/plan-test.md § "CI Job
# Grouping Guide"). Each group maps 1:1 to a parallel CI job. Run
# `pixi run build-tests` once before any test task to pre-build all
# Rust test binaries; C++ ctest tasks need `pixi run build-cpp`.
clean-env = "pkill -9 -f 'crowdb-kv-server.*test-' 2>/dev/null; pkill -9 -f 'crowdb-kv-server.*e2e' 2>/dev/null; pkill -9 -f 'crowdb-web.*test-mode' 2>/dev/null; rm -rf test-logs test-data runtime-data; true"
# Pre-build ALL Rust test binaries + bin targets in one parallel cargo
# invocation. Run this once at the start of a CI job so every subsequent
# `cargo test -p <crate>` step just executes the pre-built binaries
# without recompiling. Also builds the crowdb-kv-server / crowdb-diskdb
# debug binaries that subprocess-spawning tests (crowdb-web, crowdb-console-shared)
# need at target/debug/.
build-tests = "cargo test --workspace --all-targets --no-run"
# Verify every workspace package with tests is assigned to a CI test task.
test-task-coverage = "python tools/check-test-task-coverage.py"

# ── Lint job ──
# (uses rs-fmt / rs-lint / tree-lint defined above, no separate test-* tasks)

# ── CppTests job: C++ ctest (needs build-cpp) + Rust FFI (cc::Build) ──
test-tree-ct = { cmd = "ctest --test-dir lib/crowdb-tree/build --output-on-failure", depends-on = ["build-cpp"] }
test-common-ct = { cmd = "lib/crowdb-tree/build/crowdb-common-build/crowdbcommon_tests", depends-on = ["build-cpp"] }
test-rpc-ct = { cmd = "ctest --test-dir lib/crowdb-rpc/build --output-on-failure", depends-on = ["build-cpp"] }
test-diskio-ct = { cmd = "ctest --test-dir app/crowdb-diskio/build --output-on-failure", depends-on = ["build-cpp"] }
test-tree-ffi = { cmd = "cargo test -p crowdb-tree-ffi --all-targets" }
test-rpc-ffi = { cmd = "cargo test -p crowdb-rpc-ffi --all-targets" }
test-cpp = { cmd = '''
bash -c '
set -e
pixi run test-tree-ct
pixi run test-common-ct
pixi run test-rpc-ct
pixi run test-diskio-ct
pixi run test-tree-ffi
pixi run test-rpc-ffi
'
''', depends-on = ["build-cpp"] }

# ── UnitTests job: pure Rust, no subprocess spawning ──
test-common = { cmd = "cargo test -p crowdb-common --all-targets" }
test-protocol = { cmd = "cargo test -p crowdb-protocol --all-targets" }
test-kv-core = { cmd = "cargo test -p crowdb-kv --all-targets" }
test-kv-client = { cmd = "cargo test -p crowdb-kv-client --all-targets" }
test-chunkdb-client = { cmd = "cargo test -p crowdb-chunkdb-client --all-targets" }
test-unit = { cmd = '''
bash -c '
set -e
pixi run test-common
pixi run test-protocol
pixi run test-kv-core
pixi run test-kv-client
pixi run test-chunkdb-client
'
''', depends-on = ["build-tests"] }

# ── ServerTests job: spawns crowdb-kv-server / crowdb-diskdb / crowdb-diskio ──
test-kv-server = { cmd = "cargo test -p crowdb-kv-server --all-targets" }
test-diskdb = { cmd = "cargo test -p crowdb-diskdb --all-targets" }
test-diskdb-client = { cmd = "cargo test -p crowdb-diskdb-client --all-targets" }
test-chunkdb = { cmd = "cargo test -p crowdb-chunkdb --all-targets" }
test-chunk-client = { cmd = "cargo test -p crowdb-chunk-client --all-targets" }
test-diskio-client = { cmd = "cargo test -p crowdb-diskio-client --all-targets" }
test-server = { cmd = '''
bash -c '
set -e
pixi run clean-env
pixi run test-kv-server
pixi run test-diskdb
pixi run test-diskdb-client
pixi run test-chunkdb
pixi run test-chunk-client
pixi run test-diskio-client
'
''', depends-on = ["build-tests"] }

# ── ConsoleTests job: spawns crowdb-kv-server via lifecycle::deploy_local ──
# Build the debug binary explicitly so tests find it at target/debug/.
test-console-shared = { cmd = "cargo build -p crowdb-kv-server && cargo test -p crowdb-console-shared --all-targets" }
test-console-cli = { cmd = "cargo test -p crowdb-cli --all-targets" }
test-console-server = { cmd = "cargo build -p crowdb-kv-server && cargo test -p crowdb-web --all-targets" }
test-console = { cmd = '''
bash -c '
set -e
pixi run clean-env
pixi run test-console-shared
pixi run test-console-cli
pixi run test-console-server
'
''', depends-on = ["build-tests"] }

# ── UITests job: Playwright browser E2E + subprocess spawning ──
test-console-ui = { cmd = "cargo build -p crowdb-kv-server -p crowdb-diskdb -p crowdb-port-alloc && export CROWDB_KV_SERVER_BINARY=$(pwd)/target/debug/crowdb-kv-server && cd app/crowdb-web/ui && npm test && npx playwright test --config=e2e/realBackend.config.ts", depends-on = ["install-ui-deps"] }

# ── Full local suite (not a CI job; runs everything in one process) ──
# Grouped by CI job order. Each group task owns its component list;
# subprocess groups clean the environment before starting.
test-suite = { cmd = '''
bash -c '
set -e
pixi run test-cpp
pixi run test-unit
pixi run test-server
pixi run test-console
pixi run clean-env
pixi run test-console-ui
'
''', depends-on = ["build-cpp", "install-ui-deps"] }

# ── Coverage & LOC ───────────────────────────────────────────────
coverage = { cmd = "cargo tarpaulin --workspace --out Html --output-dir target/coverage --exclude-files '*/tests/*'", depends-on = ["install-deps"] }
loc = "tokei . .github --exclude swagger-ui --exclude 'lib/crowdb-tree/build-*' --exclude target --exclude dist --exclude node_modules --exclude 'doc/user-manual/*.html' --exclude 'doc/user-manual/*.py' --exclude package-lock.json"

# ── Clean ────────────────────────────────────────────────────────
# Removes all build/test/runtime artifacts, keeping only git-tracked
# files, the pixi env (.pixi/), and install-deps caches (node_modules).
# C++ tests create hardcoded /tmp dirs (crowdb-*-tests, crowtree_log_*,
# crowtree_metrics_test_*) — cleaned at the end.
clean = { cmd = '''
bash -c '
set -e
# Kill leftover server/cli processes via a helper script. A bare pkill -f
# here would self-match: this task runs as bash -c <body>, so the bash
# cmdline contains these names and pkill -f would SIGTERM the script.
# The helper runs as "bash tools/kill-servers.sh" (no binary names).
bash tools/kill-servers.sh

# ── Rust build artifacts ──
echo "[clean] cargo clean"
cargo clean
echo "[clean] tarpaulin report"
rm -f tarpaulin-report.html

# ── C++ build artifacts (crowdb-tree, crowdb-rpc, crowdb-diskio) ──
echo "[clean] C++ build dirs"
rm -rf lib/crowdb-tree/build lib/crowdb-tree/build-*
rm -rf lib/crowdb-tree/Testing lib/crowdb-tree/.cache
rm -rf lib/crowdb-rpc/build lib/crowdb-rpc/build-* lib/crowdb-rpc/.cache
rm -rf app/crowdb-diskio/build app/crowdb-diskio/build-* app/crowdb-diskio/.cache

# ── Frontend build artifacts (keep node_modules) ──
echo "[clean] frontend build artifacts"
rm -rf app/crowdb-web/ui/dist app/crowdb-web/ui/.vite app/crowdb-web/ui/test-results
rm -f app/crowdb-web/ui/*.tsbuildinfo

# ── Test runtime data (in-repo) ──
echo "[clean] test runtime data"
rm -rf test-logs test-data runtime-data .test-tmp lib/crowdb-tree/.test-tmp
rm -rf app/crowdb-web/ui/e2e/runtime-data
rm -rf app/crowdb-web/ctdata app/crowdb-web/waldata

# `log/` is dangerous as a glob (common Rust module name) — explicit per crate.
# Repo-root `log/` is where crowdb-kv-server writes (CWD-relative); the per-crate
# paths are future-proofing (those bins currently log under runtime-data/).
# `cli-log/` is where crowdb-cli writes cluster deploy/bench logs (CWD-relative).
echo "[clean] log dirs"
rm -rf log cli-log app/crowdb-kv-server/log app/crowdb-diskdb/log app/crowdb-chunkdb/log \
  app/crowdb-cli/log lib/crowdb-console-shared/log app/crowdb-web/log \
  app/crowdb-web/ui/e2e/log \
  lib/crowdb-chunk-client/log lib/crowdb-diskdb-client/log lib/crowdb-diskio-client/log

# ── Profiling artifacts ──
echo "[clean] profiling artifacts"
rm -rf doc/working/profile-*
rm -f doc/working/bench-*.tsv
rm -f perf.data* perf-script.txt flamegraph.svg

# ── find-based cleanup (run last, after rm steps shrink the tree) ──
# Prune heavy non-source subtrees (.pixi, node_modules, target, .git) so find
# only walks the source tree instead of 60k+ vendored/compiled entries.
echo "[clean] mutants.out"
find . \( -name .pixi -o -name node_modules -o -name target -o -name .git \) -prune \
  -o -type d -name mutants.out -print -exec rm -rf {} \; 2>/dev/null || true

# Per-crate runtime dirs — globs are safe (names do not appear in src/).
# Exclude app/ — tracked config templates live in app/*/conf/ (e.g.
# app/crowdb-diskdb/conf/crow_diskdb_config.toml) and must not be deleted.
echo "[clean] waldata/ctdata/conf runtime dirs"
find . \( -name .pixi -o -name node_modules -o -name target -o -name .git \) -prune \
  -o -type d \( -name waldata -o -name ctdata -o -name conf \) ! -path "*/src/*" ! -path "./app/*" \
  -print -exec rm -rf {} \; 2>/dev/null || true

# temp-data/ — CWD-relative runtime scratch from crowdb-console-shared
# (non-workspace deploys + SSH known_hosts fallback). Can appear at repo
# root or under app/crowdb-web/ depending on which binary creates it, so
# no app/ exclusion (unlike conf above — no tracked templates live here).
echo "[clean] temp-data runtime dirs"
find . \( -name .pixi -o -name node_modules -o -name target -o -name .git \) -prune \
  -o -type d -name temp-data ! -path "*/src/*" \
  -print -exec rm -rf {} \; 2>/dev/null || true

# ── OS junk ──
# Avoid -delete (implies -depth on BSD/macOS, breaks -prune → full traversal).
echo "[clean] .DS_Store"
find . \( -name .pixi -o -name node_modules -o -name target -o -name .git \) -prune \
  -o -name .DS_Store -print0 2>/dev/null | xargs -0 rm -f 2>/dev/null || true

# ── System temp dirs (C++ tests with hardcoded /tmp paths) ──
echo "[clean] /tmp test dirs"
rm -rf /tmp/crowdb-common-diskio-uring-tests \
       /tmp/crowdb-diskio-blocking-tests \
       /tmp/crowdb-diskio-diskset-tests \
       /tmp/crowdb-diskio-uring-tests
rm -rf /tmp/crowtree_log_* /tmp/crowtree_metrics_test_*
# Bench script temp files (config, cfgpath, output, logs)
rm -f /tmp/bench-write-reg-* /tmp/bench-read-regression-* /tmp/bench-scan-regression-* \
      /tmp/bench-rpc-regression-* /tmp/bench-compare-128t-*
echo "[clean] done"
'
''' }

# ── lib/crowdb-tree sanitizers ──────────────────────────────────────────

# AddressSanitizer build + tests. setarch -R disables ASLR (Linux only);
# on macOS we run ctest directly.
tree-asan = '''
set -e
cmake -S lib/crowdb-tree -B lib/crowdb-tree/build-asan -DCMAKE_BUILD_TYPE=Debug -DCROWDB_TREE_SANITIZER=address
cmake --build lib/crowdb-tree/build-asan -j
if command -v setarch > /dev/null 2>&1; then
  setarch -R ctest --test-dir lib/crowdb-tree/build-asan --output-on-failure
else
  ctest --test-dir lib/crowdb-tree/build-asan --output-on-failure
fi
'''

# ThreadSanitizer build + tests.
tree-tsan = '''
set -e
cmake -S lib/crowdb-tree -B lib/crowdb-tree/build-tsan -DCMAKE_BUILD_TYPE=Debug -DCROWDB_TREE_SANITIZER=thread
cmake --build lib/crowdb-tree/build-tsan -j
if command -v setarch > /dev/null 2>&1; then
  setarch -R ctest --test-dir lib/crowdb-tree/build-tsan --output-on-failure
else
  ctest --test-dir lib/crowdb-tree/build-tsan --output-on-failure
fi
'''

# UndefinedBehaviorSanitizer build + tests.
tree-ubsan = '''
set -e
cmake -S lib/crowdb-tree -B lib/crowdb-tree/build-ubsan -DCMAKE_BUILD_TYPE=Debug -DCROWDB_TREE_SANITIZER=undefined
cmake --build lib/crowdb-tree/build-ubsan -j
export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
if command -v setarch > /dev/null 2>&1; then
  setarch -R ctest --test-dir lib/crowdb-tree/build-ubsan --output-on-failure
else
  ctest --test-dir lib/crowdb-tree/build-ubsan --output-on-failure
fi
'''
